metadata_version: 1
name: Low Mass Stellar Binaries are Bound from Birth
description: |-
  This capsule includes the scripts used to identify gas halos and multiples for the article "Stellar Binaries are Bound from Birth" (abstract below). We provide a smaller demo dataset with this capsule, from a StarForge simulation of a smaller cloud with 2x10^3 Msun. While sharing the full end-to-end analysis from the paper is impractical, this capsule will make our halo and multiple identification algorithms reproducible.

Abstract: "Most main sequence stars, unlike our Sun, are members of systems with two
or more stars. How and when these systems form and become gravitationally
bound remains debated, since resolving the earliest stages of star formation is
challenging. We analyze simulations of star cluster formation in typical Milky
Way conditions, which include all key physics and stellar feedback mechanisms, to
understand how multiple systems form. We show that ≈ 70−80% of binaries are
gravitationally bound from the moment the second star forms. Binaries evolve and
accrete together, which will affect their planetary systems and chemical evolution.
Half of the binaries are disrupted by the end of the star-formation epoch, such
that ≈ 40% of the final single stars belonged to a multiple at some point, with
implications for the stellar initial mass function. Formation in multiples is the
dominant mode of star formation, accounting for at least 57% of stars."
